[project]
name = "webdev-template-api"
version = "0.1.0"
description = "FastAPI backend for the web development template"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
]
